  {# "Add this to the comparison", on a database index.

     This was a map marker, on the reasoning that a pushpin at 24px is a blob.
     It is a blob; a map marker is worse, because it is not ambiguous at all —
     it says LOCATION, clearly, on a card about a sword. An icon that reads
     wrongly and confidently beats one that reads vaguely only in the sense
     that you notice the vague one and go and read the label.

     A plus in a square instead: unambiguously "add", pairs with the tick below
     for the added state, and survives one stroke weight at 24px. #}
  <symbol id="icon-add" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="3"></rect>
