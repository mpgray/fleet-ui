name: Code health

# Weekly audit (audit only — this repo has never had a fix job). Shared with the fleet; the probes and the
# repo-specific prompt text are the inputs below.
#
# The cron is this repo's slot in a deliberate three-hourly stagger, recorded
# in fleet-ci/fleet.yml so it is data rather than six good intentions.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: code-health
  cancel-in-progress: false

jobs:
  agent:
    # A called workflow can never hold MORE than this job grants, and this
    # repository's default GITHUB_TOKEN is `read`. Granting nothing made the
    # called workflow's `write` a request to escalate, which GitHub refuses as
    # `startup_failure` — with no log to say why. Keep this in step with the
    # `permissions:` block in fleet-ci's copy of the workflow.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: mpgray/fleet-ci/.github/workflows/code-health.yml@bb255a677e1c62358447b02f318a8e90bd257da7
    secrets: inherit
    with:
      enable_fix: false
      health_probes: |
        echo '## Tokens used by site.css'
        grep -o 'var(--[a-z-]*)' css/site.css | sort -u
        echo
        echo '## Selectors per stylesheet'
        for f in css/site.css css/themes/*.css; do
          printf '%s %s\n' "$(grep -c '{' "$f")" "$f"
        done | sort -rn
        echo
        echo '## Consumers pinned at'
        echo '(checked by the bump workflow, not here)'
        echo
        echo '## Churn, last 90 days'
        git log --since=90.days --name-only --format= -- css templates \
          | grep -v '^$' | sort | uniq -c | sort -rn
      audit_focus: |
              * a theme preset missing a token site.css uses, which renders as
                nothing rather than as an error
      forbidden_summary: 'no changes to the twelve-token CSS contract without every preset declaring them'
