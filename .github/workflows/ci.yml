name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # The fonts job commits vendored faces back into the pull request branch, so
  # nobody has to run a script after editing a preset. Read-only everywhere else.
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install jinja2 tinycss2

      # Every consumer renders these templates. A syntax error here does not
      # break this repo — it breaks two sites at once, at the moment someone
      # bumps a pin, which is a long way from the change that caused it.
      - name: Templates parse
        run: |
          python - <<'PY'
          import pathlib, sys
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader('templates'))
          failed = []
          for path in pathlib.Path('templates').rglob('*.html'):
              name = str(path.relative_to('templates'))
              try:
                  env.get_template(name)
              except Exception as exc:
                  failed.append(f'{name}: {exc}')
          for line in failed:
              print('FAIL', line)
          print(f'{len(list(pathlib.Path("templates").rglob("*.html")))} templates parsed')
          sys.exit(1 if failed else 0)
          PY

      - name: CSS parses
        run: |
          python - <<'PY'
          import pathlib, sys, tinycss2
          failed = []
          for path in pathlib.Path('css').rglob('*.css'):
              rules, err = tinycss2.parse_stylesheet_bytes(path.read_bytes())
              errors = [r for r in rules if r.type == 'error']
              for e in errors:
                  failed.append(f'{path}:{e.source_line} {e.message}')
          for line in failed:
              print('FAIL', line)
          sys.exit(1 if failed else 0)
          PY

      # The contract between site.css and the theme presets: structural CSS may
      # only use variables every preset defines. A var() with no declaration
      # renders as nothing and the failure is a colour that silently vanishes on
      # one site — which is exactly the drift this repo exists to prevent.
      #
      # site.css also declares its own scales (space, type, radius, elevation).
      # Those are structure, not brand, so they are subtracted before the check
      # — otherwise every preset would have to restate two dozen values it has
      # no opinion about, and the twelve-token contract would be a fiction.
      #
      # The equality assertion is the point of the job. Without it the contract
      # grows one token at a time, each addition individually reasonable, until
      # a new consumer needs a spreadsheet to onboard. Adding a thirteenth
      # REQUIRED token means editing this list, in a diff someone reviews.
      - name: Every token used is declared by every theme
        run: |
          python - <<'PY'
          import pathlib, re, sys
          CONTRACT = {
              '--bg', '--surface', '--text', '--muted', '--accent',
              '--accent-contrast', '--border', '--font-body', '--font-heading',
              '--radius', '--header-bg', '--header-text',
          }
          site = pathlib.Path('css/site.css').read_text()
          used = set(re.findall(r'var\(\s*(--[\w-]+)', site))
          self_declared = set(re.findall(r'^\s*(--[\w-]+)\s*:', site, re.M))
          required = used - self_declared

          failed = False
          if required != CONTRACT:
              failed = True
              for tok in sorted(required - CONTRACT):
                  print(f'FAIL site.css requires {tok} from presets but it is '
                        f'not in the twelve-token contract — declare a default '
                        f'in site.css, or add it to CONTRACT deliberately')
              for tok in sorted(CONTRACT - required):
                  print(f'FAIL {tok} is in the contract but site.css no longer '
                        f'uses it — remove it from CONTRACT and from the README')

          for theme in sorted(pathlib.Path('css/themes').glob('*.css')):
              declared = set(re.findall(r'^\s*(--[\w-]+)\s*:', theme.read_text(), re.M))
              missing = CONTRACT - declared
              if missing:
                  failed = True
                  print(f'FAIL {theme.name} does not declare: {", ".join(sorted(missing))}')

          print(f'{len(used)} tokens used by site.css, '
                f'{len(self_declared)} declared by it, {len(required)} required of presets')
          sys.exit(1 if failed else 0)
          PY

      # Four of the ten presets shipped below AA on --muted, which is the
      # colour of nearly all the small type on the site. A swatch review does
      # not catch that; arithmetic does.
      - name: Every preset clears WCAG AA
        run: python scripts/check_contrast.py

      # ── Vendored typefaces ───────────────────────────────────────────────
      #
      # The presets are the source of truth for which faces exist: this reads
      # --font-body and --font-heading out of every one of them and syncs
      # css/fonts/ to match, adding what is named and deleting what is not.
      #
      # It runs HERE rather than at deploy time on purpose. fleet-ui reaches
      # production by SHA — consumers pin it as a submodule and cache-bust their
      # stylesheets with that hash — so faces fetched at deploy time would not
      # be the bytes the pin identifies, and every deploy of every consumer
      # would grow a hard dependency on an npm CDN being up. Vendored faces are
      # committed artifacts, exactly like the CSS beside them.
      #
      # And it COMMITS rather than merely complaining, so that editing a
      # preset's --font-heading is the whole job. The check below runs after the
      # sync, in the same step, so a run that vendors the wrong thing fails the
      # PR instead of quietly committing it.
      - name: Vendor the faces the presets name
        if: github.event_name == 'pull_request'
        run: |
          python scripts/vendor_fonts.py
          python scripts/vendor_fonts.py --check

      - name: Commit any font changes back to the branch
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(git status --porcelain css/fonts)" ]; then
            echo "css/fonts is already in step with the presets."
            exit 0
          fi
          git config user.name  "fleet-ui bot"
          git config user.email "noreply@github.com"
          git add css/fonts
          git commit -m "vendor the faces the presets name

          Generated by scripts/vendor_fonts.py. The presets are the source of
          truth for which families exist; this is CI keeping css/fonts in step
          so that editing --font-heading is the whole job."
          git push origin "HEAD:${{ github.head_ref }}"

      # On main the sync cannot commit (the branch is protected), so it only
      # reports. A mismatch here means something reached main without the PR
      # job running — worth a red build rather than a silent Times fallback.
      - name: Vendored faces match the presets
        if: github.event_name != 'pull_request'
        run: python scripts/vendor_fonts.py --check
