name: Bug triage

# Label an issue `bug` and an agent tries to REPRODUCE it, then either hands off
# to the story agent by relabelling, asks for what it needs, or rules it out.
# It cannot write code: contents: read, and no Write or Edit in its allowlist.
#
# fleet-ui has no story.yml, so a successful reproduction lands a `story` label
# with nothing listening. That is fine: the reproduction in the comment is the
# value, and adding story.yml later starts the handoff with no change here.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to triage'
        required: true

concurrency:
  group: bug-triage-${{ github.event.issue.number || github.event.inputs.issue }}
  cancel-in-progress: false

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bug'
    uses: mpgray/fleet-ci/.github/workflows/bug-triage.yml@ddf5b83087307572a09c05e7eb01f53f66583811
    secrets: inherit
    with:
      # fleet-ui has no pyproject.toml and no uv.lock — it is templates and CSS
      # with two pip dependencies. The shared workflow's `uv sync --dev` default
      # would fail here, so setup is spelled out.
      setup: pip install jinja2 tinycss2
      issue: ${{ github.event.issue.number || github.event.inputs.issue }}
      repro_hint: |
        This repo has no app to run. A 'bug' here is a theme preset missing a token
        or a contrast failure: `python3 scripts/check_contrast.py` is the check.
