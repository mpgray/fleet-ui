name: Bump consumer pins

# fleet-ui is not deployed anywhere. It reaches production by being pinned as a
# submodule in the sites that use it, so "shipping" a change here means opening
# a pull request in each consumer that moves its pin.
#
# Deliberately a PR and not a direct commit. A CSS change is still a change to
# two live sites, and pushing it straight to their main branches would be the
# one path into production with no tests and no review anywhere along it. The
# PRs it opens run each consumer's own test suite and get the same AI review as
# anything else.
#
# Requires: FLEET_PIN_TOKEN — a fine-grained PAT with Contents: write and
# Pull requests: write on mpgray/articles-ai and mpgray/game-db. The default
# GITHUB_TOKEN cannot do this: it is scoped to this repository only.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bump-consumers
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      # One PR per consumer, and one failing consumer must not stop the other.
      #
      # toolbox joined on 2026-08-24. It has vendored fleet-ui since it was
      # written and was never in this list; its pin was current at the time
      # only because someone had been moving it by hand. That is the state this
      # workflow exists to make unnecessary — the risk was never that toolbox
      # was behind, it was that nothing would tell you when it fell behind.
      #
      # ai-help is deliberately NOT here. It renders fleet themes but keeps its
      # CSS inline and has no vendor/fleet-ui; see the comment at the top of
      # ai-help/app/templates/base.html, which records that as an open decision
      # rather than an oversight. Adding it means settling that decision first.
      matrix:
        consumer: [articles-ai, game-db, toolbox]
      fail-fast: false

    steps:
      - name: Check out this commit
        uses: actions/checkout@v7
        with:
          path: fleet-ui
          # Full history, because "Move the pin" below runs
          # `git log "$OLD..$NEW"` in here — and $OLD is the commit the consumer
          # is currently pinned to, which in a default depth-1 clone does not
          # exist. That made this workflow fail on every run it ever had: git
          # errored, `set -e` aborted the block mid-heredoc, and the runner
          # rejected a $GITHUB_OUTPUT file whose `log<<EOF` was never closed
          # ("Invalid value. Matching delimiter not found 'EOF'"). Seven runs,
          # seven failures, no pin ever bumped and no PR ever opened.
          fetch-depth: 0

      - name: Check out ${{ matrix.consumer }}
        uses: actions/checkout@v7
        with:
          repository: mpgray/${{ matrix.consumer }}
          token: ${{ secrets.FLEET_PIN_TOKEN }}
          path: consumer
          submodules: recursive
          fetch-depth: 0

      - name: Move the pin
        id: bump
        working-directory: consumer
        run: |
          set -euo pipefail
          NEW="$(git -C ../fleet-ui rev-parse HEAD)"
          OLD="$(git -C vendor/fleet-ui rev-parse HEAD)"

          if [ "$OLD" = "$NEW" ]; then
            echo "already pinned to ${NEW:0:12}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C vendor/fleet-ui fetch --quiet origin
          git -C vendor/fleet-ui checkout --quiet "$NEW"

          # Built into a variable FIRST, then written in one go. The previous
          # version streamed `log<<EOF`, the git output and `EOF` straight into
          # $GITHUB_OUTPUT — so a git failure under `set -e` left the heredoc
          # open and the runner threw away the whole output file, taking the
          # `changed` flag with it. A malformed output file is a much worse
          # failure than a missing commit list: it loses the diagnosis too.
          #
          # `|| true` because the commit list is a courtesy for the reviewer,
          # not the point of the job. Moving the pin is the point, and it should
          # not be blocked by an unreachable revision.
          LOG="$(git -C ../fleet-ui log --oneline "$OLD..$NEW" 2>/dev/null | sed 's/^/  /' || true)"
          if [ -z "$LOG" ]; then
            LOG="  (commit list unavailable — compare $OLD..$NEW in fleet-ui)"
          fi

          # A random delimiter, not the literal EOF. GitHub rejects the file if
          # any line of the value equals the delimiter, and a commit subject
          # that happens to be "EOF" is exactly the kind of thing that breaks
          # once a year and is never diagnosed.
          DELIM="log_$(openssl rand -hex 8)"
          {
            echo "log<<$DELIM"
            echo "$LOG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
          echo "old=${OLD:0:12}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW:0:12}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        working-directory: consumer
        env:
          GH_TOKEN: ${{ secrets.FLEET_PIN_TOKEN }}
          # Through the environment, not `${{ }}` inside the script. NEW_LOG is
          # a list of commit subjects from another repository, and GitHub
          # expressions are substituted as raw text BEFORE bash sees the line —
          # so a subject containing a backtick or $(...) was a command running
          # on a runner that holds FLEET_PIN_TOKEN, a credential with write
          # access to both consumers. Trusted-ish input, but nothing about the
          # `env:` form costs anything.
          NEW_SHA: ${{ steps.bump.outputs.new }}
          OLD_SHA: ${{ steps.bump.outputs.old }}
          NEW_LOG: ${{ steps.bump.outputs.log }}
        run: |
          set -euo pipefail
          BRANCH="fleet-ui/$NEW_SHA"
          git config user.name  'fleet-ui bump'
          git config user.email 'actions@github.com'

          # Reuse the branch if this workflow already ran for this commit —
          # a re-run should update the existing PR, not fail on a duplicate.
          git checkout -B "$BRANCH"
          git add vendor/fleet-ui
          git commit -m "Bump fleet-ui to $NEW_SHA

          $NEW_LOG

          Opened by fleet-ui/.github/workflows/bump-consumers.yml. Structural CSS
          and the shared macros live in one repo and are pinned by SHA in each
          consumer; this is the pin moving. Until both consumers are on the same
          commit the admin dashboard reports the two sites as drifted, which is
          the alarm working rather than a fault."
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "pull request already open for $BRANCH — updated in place"
            exit 0
          fi

          gh pr create \
            --title "Bump fleet-ui to $NEW_SHA" \
            --body "$(cat <<BODY
          Moves the pinned shared-UI commit from \`$OLD_SHA\` to \`$NEW_SHA\`.

          ### fleet-ui commits in this range
          \`\`\`
          $NEW_LOG
          \`\`\`

          ### Why this is a pull request
          fleet-ui is not deployed. It reaches production through this pin, so
          this is the only point at which a change to shared CSS or a shared
          macro is reviewed and tested against the site that renders it.

          ### What to check
          - The consumer's own tests pass — several of them assert on markup
            these macros produce.
          - The other consumer has an identical PR. Merging one and not the
            other is what the drift alarm on the admin dashboard is for, and it
            will fire until both are on the same commit.

          ### Risk
          Visual. Nothing here changes behaviour, and nothing here is covered by
          a screenshot test, so a bad merge looks like a page that renders in
          the wrong colours rather than a page that errors.
          BODY
          )" \
            --label fleet-ui
