name: Bump consumer pins

# fleet-ui is not deployed anywhere. It reaches production by being pinned as a
# submodule in the sites that use it, so "shipping" a change here means opening
# a pull request in each consumer that moves its pin.
#
# Deliberately a PR and not a direct commit. A CSS change is still a change to
# two live sites, and pushing it straight to their main branches would be the
# one path into production with no tests and no review anywhere along it. The
# PRs it opens run each consumer's own test suite and get the same AI review as
# anything else.
#
# ## One rolling PR per consumer, not one per commit
#
# The branch is `fleet-ui/pin` and is reused. Opening `fleet-ui/<sha>` per push
# meant every fleet-ui commit fanned out into three more PRs that all moved the
# same submodule pointer, so merging one made the rest conflict. See the long
# comment on the push step for what that looked like in practice.
#
# Requires: FLEET_PIN_TOKEN — a fine-grained PAT with Contents: write and
# Pull requests: write on mpgray/articles-ai, mpgray/game-db and
# mpgray/toolbox — every repo in the matrix below. The default
# GITHUB_TOKEN cannot do this: it is scoped to this repository only.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bump-consumers
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      # One PR per consumer, and one failing consumer must not stop the other.
      #
      # toolbox joined on 2026-08-24. It has vendored fleet-ui since it was
      # written and was never in this list; its pin was current at the time
      # only because someone had been moving it by hand. That is the state this
      # workflow exists to make unnecessary — the risk was never that toolbox
      # was behind, it was that nothing would tell you when it fell behind.
      #
      # ai-help is deliberately NOT here. It renders fleet themes but keeps its
      # CSS inline and has no vendor/fleet-ui; see the comment at the top of
      # ai-help/app/templates/base.html, which records that as an open decision
      # rather than an oversight. Adding it means settling that decision first.
      matrix:
        consumer: [articles-ai, game-db, toolbox]
      fail-fast: false

    steps:
      - name: Check out this commit
        uses: actions/checkout@v7
        with:
          path: fleet-ui
          # Full history, because "Move the pin" below runs
          # `git log "$OLD..$NEW"` in here — and $OLD is the commit the consumer
          # is currently pinned to, which in a default depth-1 clone does not
          # exist. That made this workflow fail on every run it ever had: git
          # errored, `set -e` aborted the block mid-heredoc, and the runner
          # rejected a $GITHUB_OUTPUT file whose `log<<EOF` was never closed
          # ("Invalid value. Matching delimiter not found 'EOF'"). Seven runs,
          # seven failures, no pin ever bumped and no PR ever opened.
          fetch-depth: 0

      - name: Check out ${{ matrix.consumer }}
        uses: actions/checkout@v7
        with:
          repository: mpgray/${{ matrix.consumer }}
          token: ${{ secrets.FLEET_PIN_TOKEN }}
          path: consumer
          submodules: recursive
          fetch-depth: 0

      - name: Move the pin
        id: bump
        working-directory: consumer
        run: |
          set -euo pipefail
          NEW="$(git -C ../fleet-ui rev-parse HEAD)"
          OLD="$(git -C vendor/fleet-ui rev-parse HEAD)"

          if [ "$OLD" = "$NEW" ]; then
            echo "already pinned to ${NEW:0:12}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C vendor/fleet-ui fetch --quiet origin
          git -C vendor/fleet-ui checkout --quiet "$NEW"

          # Built into a variable FIRST, then written in one go. The previous
          # version streamed `log<<EOF`, the git output and `EOF` straight into
          # $GITHUB_OUTPUT — so a git failure under `set -e` left the heredoc
          # open and the runner threw away the whole output file, taking the
          # `changed` flag with it. A malformed output file is a much worse
          # failure than a missing commit list: it loses the diagnosis too.
          #
          # `|| true` because the commit list is a courtesy for the reviewer,
          # not the point of the job. Moving the pin is the point, and it should
          # not be blocked by an unreachable revision.
          LOG="$(git -C ../fleet-ui log --oneline "$OLD..$NEW" 2>/dev/null | sed 's/^/  /' || true)"
          if [ -z "$LOG" ]; then
            LOG="  (commit list unavailable — compare $OLD..$NEW in fleet-ui)"
          fi

          # A random delimiter, not the literal EOF. GitHub rejects the file if
          # any line of the value equals the delimiter, and a commit subject
          # that happens to be "EOF" is exactly the kind of thing that breaks
          # once a year and is never diagnosed.
          DELIM="log_$(openssl rand -hex 8)"
          {
            echo "log<<$DELIM"
            echo "$LOG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
          echo "old=${OLD:0:12}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW:0:12}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the rolling pin pull request
        if: steps.bump.outputs.changed == 'true'
        working-directory: consumer
        env:
          GH_TOKEN: ${{ secrets.FLEET_PIN_TOKEN }}
          # Through the environment, not `${{ }}` inside the script. NEW_LOG is
          # a list of commit subjects from another repository, and GitHub
          # expressions are substituted as raw text BEFORE bash sees the line —
          # so a subject containing a backtick or $(...) was a command running
          # on a runner that holds FLEET_PIN_TOKEN, a credential with write
          # access to every consumer. Trusted-ish input, but nothing about the
          # `env:` form costs anything.
          NEW_SHA: ${{ steps.bump.outputs.new }}
          OLD_SHA: ${{ steps.bump.outputs.old }}
          NEW_LOG: ${{ steps.bump.outputs.log }}
        run: |
          set -euo pipefail

          # ONE branch, reused forever — not one per fleet-ui commit.
          #
          # This used to be `fleet-ui/$NEW_SHA`, which opened a fresh branch and
          # a fresh PR on every push to fleet-ui main. Four fleet-ui commits
          # meant twelve open PRs across three consumers, every one of them
          # moving the SAME submodule pointer, so merging any one made the other
          # eleven conflict. On 2026-08-25 that was nine open pin PRs, seven of
          # them conflicting, and the newest — the only one worth reviewing —
          # was indistinguishable from the stale ones in the list.
          #
          # A rolling branch collapses that to at most one open PR per consumer,
          # always at the current fleet-ui HEAD. Intermediate pins are not worth
          # reviewing individually: nothing deploys from fleet-ui, so skipping
          # from pin A to pin C is the same review as A to B to C, minus two
          # merge conflicts.
          BRANCH="fleet-ui/pin"

          git config user.name  'fleet-ui bump'
          git config user.email 'actions@github.com'

          # Never clobber a human.
          #
          # The per-SHA branch could be force-pushed safely because nothing else
          # ever touched it. A rolling branch cannot: if someone pushed a fixup
          # onto this PR — a snapshot updated for the new CSS, a template tweak
          # the macro change required — a force-push here destroys it with no
          # reflog they can reach. So: bail out and say so, rather than reset.
          #
          # One commit by 'fleet-ui bump' is this workflow's own previous run
          # and is safe to replace. Anything else is not ours.
          if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            AHEAD="$(git rev-list --count "origin/main..origin/$BRANCH")"
            AUTHORS="$(git log --format='%an' "origin/main..origin/$BRANCH" | sort -u | tr '\n' ',')"
            if [ "$AHEAD" -gt 1 ] || [ "$AUTHORS" != "fleet-ui bump," ]; then
              echo "::warning::$BRANCH carries work that is not this workflow's" \
                   "($AHEAD commit(s), authors: $AUTHORS). Refusing to force-push over it."
              gh pr comment "$BRANCH" --body \
                "fleet-ui has moved on to \`$NEW_SHA\`, but this branch carries commits this workflow did not make, so it was left alone. Merge or close this PR and the next fleet-ui push will open a fresh one at the current HEAD." \
                2>/dev/null || true
              exit 0
            fi
          fi

          # Branch off the consumer's main every time, so the PR is always
          # "main plus one pin commit" and never accumulates a stale base.
          git checkout -B "$BRANCH"
          git add vendor/fleet-ui
          git commit -m "Bump fleet-ui to $NEW_SHA

          $NEW_LOG

          Opened by fleet-ui/.github/workflows/bump-consumers.yml. Structural CSS
          and the shared macros live in one repo and are pinned by SHA in each
          consumer; this is the pin moving. Until every consumer is on the same
          commit the admin dashboard reports the sites as drifted, which is the
          alarm working rather than a fault."
          git push --force-with-lease origin "$BRANCH"

          TITLE="Bump fleet-ui to $NEW_SHA"

          # A plain heredoc redirect to a file, NOT `$(cat <<BODY ... BODY)`.
          # The command-substitution form is what this step used to use, and it
          # parses only on bash 4+; on the bash 3.2 that ships with macOS a
          # local `bash -n` of this script reports a syntax error that does not
          # exist on the runner. A form that checks the same everywhere is worth
          # more than one saved variable.
          BODY_FILE="$RUNNER_TEMP/fleet-ui-pin-body.md"
          cat > "$BODY_FILE" <<BODY
          Moves the pinned shared-UI commit from \`$OLD_SHA\` to \`$NEW_SHA\`.

          ### fleet-ui commits in this range
          \`\`\`
          $NEW_LOG
          \`\`\`

          ### Why this is a pull request
          fleet-ui is not deployed. It reaches production through this pin, so
          this is the only point at which a change to shared CSS or a shared
          macro is reviewed and tested against the site that renders it.

          ### This is a rolling branch
          \`fleet-ui/pin\` is reused and force-updated on every fleet-ui push, so
          this PR always shows the current HEAD rather than one pin in a queue of
          them. If you push a fixup here, the workflow stops updating it and says
          so instead of overwriting your commit.

          ### What to check
          - The consumer's own tests pass, since several of them assert on the
            markup these macros produce.
          - The other consumers have an identical PR. Merging one and not the
            others is what the drift alarm on the admin dashboard is for, and it
            will fire until every consumer is on the same commit.

          ### Risk
          Visual. Nothing here changes behaviour, and nothing here is covered by
          a screenshot test, so a bad merge looks like a page that renders in
          the wrong colours rather than a page that errors.
          BODY

          # The branch is stable, so the PR usually already exists and its title
          # still names the OLD sha. Edit it rather than leaving a PR whose title
          # disagrees with its diff.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE"
            echo "updated the open pin PR to $NEW_SHA"
          else
            # Create the label first, idempotently. toolbox joined the matrix
            # without one, so `gh pr create --label fleet-ui` opened the PR and
            # THEN exited 1 on the missing label - a red job for work that had
            # already succeeded, which is the kind of failure you learn to
            # ignore and then miss a real one behind. A consumer added later
            # would hit exactly the same wall.
            gh label create fleet-ui --color BFD4F2 \
              --description 'Moves the vendored fleet-ui pin' 2>/dev/null || true
            gh pr create --title "$TITLE" --body-file "$BODY_FILE" --label fleet-ui
          fi
