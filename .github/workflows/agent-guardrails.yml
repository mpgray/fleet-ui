name: Agent guardrails

# The shared half of the block list is fleet-ci's guardrails-core: the
# workflows, the review guidelines, .github/actions/, applied migrations, and
# deleting or renaming tests out of tests/. This file carries only what is
# fleet-ui's own.
#
# Keep extra_rules in step with the "what you may not touch" text the agent
# prompts are given — a prompt that forbids less than the check bills you for
# the argument.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  guardrails:
    # A called workflow can never hold MORE than this job grants, and this
    # repository's default GITHUB_TOKEN is `read`. Granting nothing made the
    # called workflow's `write` a request to escalate, which GitHub refuses as
    # `startup_failure` — with no log to say why. Keep this in step with the
    # `permissions:` block in fleet-ci's copy of the workflow.
    permissions:
      contents: read
    uses: mpgray/fleet-ci/.github/workflows/guardrails-core.yml@bb255a677e1c62358447b02f318a8e90bd257da7
