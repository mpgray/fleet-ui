name: AI preflight
description: Confirm the configured AI endpoint answers with the configured credential.

# One cheap request before any agent runs, for two reasons.
#
# The credential path here is not obvious. The action forwards an explicit
# allowlist of provider variables to the Claude CLI — ANTHROPIC_API_KEY,
# ANTHROPIC_BASE_URL, ANTHROPIC_CUSTOM_HEADERS — and ANTHROPIC_AUTH_TOKEN is
# not on that list. It may still arrive by ordinary job-env inheritance. "May"
# is not a good enough answer for the thing every agent depends on, so this
# asks the endpoint directly and fails in two seconds instead of after a
# forty-turn run.
#
# It also proves which endpoint actually served the request, which is the
# question a base-URL override always raises and never answers on its own.

inputs:
  base_url:
    description: Origin of the Messages API, no trailing /v1
    required: true
  token:
    description: Credential for that endpoint
    required: true
  model:
    description: A model id valid at that endpoint
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE: ${{ inputs.base_url }}
        TOKEN: ${{ inputs.token }}
        MODEL: ${{ inputs.model }}
      run: |
        set -uo pipefail

        if [ -z "$TOKEN" ]; then
          echo "::error::No AI credential. Set the OPENROUTER_API_KEY secret (or AI_GATEWAY_TOKEN)."
          exit 1
        fi
        echo "endpoint: $BASE"
        echo "model:    $MODEL"

        # Both auth schemes are sent. OpenRouter's Anthropic-compatible endpoint
        # and a self-hosted gateway do not agree on which header carries the
        # key, and sending both costs nothing while removing a whole class of
        # "it 401s and nobody knows why".
        code=$(curl -sS -o /tmp/ai-preflight.json -w '%{http_code}' --max-time 30 \
          -X POST "${BASE%/}/v1/messages" \
          -H 'content-type: application/json' \
          -H 'anthropic-version: 2023-06-01' \
          -H "x-api-key: $TOKEN" \
          -H "authorization: Bearer $TOKEN" \
          -d "{\"model\":\"$MODEL\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}" \
          || echo 000)

        echo "HTTP $code"
        case "$code" in
          200|201)
            echo "ok — the endpoint answered and the credential was accepted"
            ;;
          401|403)
            echo "::error::$BASE rejected the credential (HTTP $code). Wrong key, or the key does not belong to this endpoint."
            head -c 400 /tmp/ai-preflight.json; exit 1 ;;
          404)
            echo "::error::No Messages API at ${BASE%/}/v1/messages. AI_BASE_URL takes the ORIGIN only — no trailing /v1."
            head -c 400 /tmp/ai-preflight.json; exit 1 ;;
          400|422)
            # The endpoint is reachable and the credential was accepted well
            # enough to get as far as validating the body. Almost always a
            # model id this endpoint does not serve.
            echo "::error::$BASE rejected the request (HTTP $code) — usually a model id it does not serve: $MODEL"
            head -c 400 /tmp/ai-preflight.json; exit 1 ;;
          000)
            echo "::error::Could not reach $BASE at all."; exit 1 ;;
          *)
            echo "::error::Unexpected HTTP $code from $BASE"
            head -c 400 /tmp/ai-preflight.json; exit 1 ;;
        esac
